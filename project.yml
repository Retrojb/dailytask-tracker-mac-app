name: RetroDailyTracker
options:
  bundleIdPrefix: com.retro
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""

targets:
  RetroDailyTracker:
    type: application
    platform: macOS
    sources:
      - path: RetroDailyTracker/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.dailytracker
        INFOPLIST_GENERATION_MODE: GeneratedFile
        PRODUCT_NAME: RetroDailyTracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: RetroDailyTracker/RetroDailyTracker.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: RetroDailyTracker/RetroDailyTracker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.retro.dailytracker
        com.apple.security.network.client: true
    dependencies:
      - target: DailyTrackerWidget
        embed: true
        codeSign: true

  RetroDailyTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RetroDailyTrackerTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.dailytracker.tests
        PRODUCT_NAME: RetroDailyTrackerTests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: RetroDailyTracker
        embed: false

  DailyTrackerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: DailyTrackerWidget/Sources
      - path: Shared
    info:
      path: DailyTrackerWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.dailytracker.widget
        PRODUCT_NAME: DailyTrackerWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: DailyTrackerWidget/DailyTrackerWidget.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    entitlements:
      path: DailyTrackerWidget/DailyTrackerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.retro.dailytracker
        com.apple.security.network.client: true

schemes:
  RetroDailyTracker:
    build:
      targets:
        RetroDailyTracker: all
        DailyTrackerWidget: all
        RetroDailyTrackerTests: [testing]
    run:
      config: Debug
      executable: RetroDailyTracker
    test:
      config: Debug
      targets:
        - RetroDailyTrackerTests
    profile:
      config: Release
      executable: RetroDailyTracker
    analyze:
      config: Debug
    archive:
      config: Release
