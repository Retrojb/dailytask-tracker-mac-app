name: RetroDailyTracker
options:
  bundleIdPrefix: com.retro
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

# Build settings shared across configurations live in these xcconfig files.
# Config/Base.xcconfig holds the OAuth client IDs and redirect URIs and pulls in
# the gitignored Config/Local.xcconfig for per-developer overrides.
# Do not duplicate those keys in the `settings` blocks below: target-level
# settings in the project file take precedence over xcconfig values, which would
# make Local.xcconfig silently ineffective.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""

targets:
  RetroDailyTracker:
    type: application
    platform: macOS
    sources:
      - path: RetroDailyTracker/Sources
      - path: Shared
      # Icon Composer icon. `.icon` is a directory, so `type: file` stops XcodeGen
      # recursing into it and adding icon.json and the layer images as separate
      # resources — Xcode must see the bundle as one asset to compile it.
      # The filename must match ASSETCATALOG_COMPILER_APPICON_NAME (AppIcon).
      - path: RetroDailyTracker/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.dailytracker
        PRODUCT_NAME: RetroDailyTracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: RetroDailyTracker/RetroDailyTracker.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # Mirrors the value previously set directly in Xcode. Kept here so that
        # regenerating the project does not silently drop the signing team.
        DEVELOPMENT_TEAM: HN4UF8N9J4
    # Generated by XcodeGen into RetroDailyTracker/Info.plist. The $(VAR)
    # references are expanded by Xcode at build time from the xcconfig files,
    # which is how OAuth configuration reaches AppConfig at runtime.
    info:
      path: RetroDailyTracker/Info.plist
      properties:
        GoogleOAuthClientID: "$(GOOGLE_OAUTH_CLIENT_ID)"
        GoogleOAuthRedirectScheme: "$(GOOGLE_OAUTH_REDIRECT_SCHEME)"
        GoogleOAuthRedirectURI: "$(GOOGLE_OAUTH_REDIRECT_URI)"
        MicrosoftOAuthClientID: "$(MICROSOFT_OAUTH_CLIENT_ID)"
        MicrosoftOAuthRedirectScheme: "$(MICROSOFT_OAUTH_REDIRECT_SCHEME)"
        MicrosoftOAuthRedirectURI: "$(MICROSOFT_OAUTH_REDIRECT_URI)"
        # Declares the custom schemes the app can receive. ASWebAuthenticationSession
        # intercepts the callback itself, so this is not strictly required for the
        # in-app flow, but registering the schemes keeps macOS from routing them
        # elsewhere and documents them for anyone inspecting the bundle.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER).oauth.google"
            CFBundleURLSchemes:
              - "$(GOOGLE_OAUTH_REDIRECT_SCHEME)"
          - CFBundleTypeRole: Editor
            CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER).oauth.microsoft"
            CFBundleURLSchemes:
              - "$(MICROSOFT_OAUTH_REDIRECT_SCHEME)"
    entitlements:
      path: RetroDailyTracker/RetroDailyTracker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.retro.dailytracker
        com.apple.security.network.client: true
    dependencies:
      - target: DailyTrackerWidget
        embed: true
        codeSign: true

  RetroDailyTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RetroDailyTrackerTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.dailytracker.tests
        PRODUCT_NAME: RetroDailyTrackerTests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: RetroDailyTracker
        embed: false

  DailyTrackerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: DailyTrackerWidget/Sources
      - path: Shared
    info:
      path: DailyTrackerWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.dailytracker.widget
        PRODUCT_NAME: DailyTrackerWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: DailyTrackerWidget/DailyTrackerWidget.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        # Both mirror values previously set directly in Xcode, restored here so
        # that regenerating the project preserves them.
        INFOPLIST_KEY_CFBundleDisplayName: "Daily Tracker"
        DEVELOPMENT_TEAM: HN4UF8N9J4
    entitlements:
      path: DailyTrackerWidget/DailyTrackerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.retro.dailytracker
        com.apple.security.network.client: true

schemes:
  RetroDailyTracker:
    build:
      targets:
        RetroDailyTracker: all
        DailyTrackerWidget: all
        RetroDailyTrackerTests: [testing]
    run:
      config: Debug
      executable: RetroDailyTracker
    test:
      config: Debug
      targets:
        - RetroDailyTrackerTests
    profile:
      config: Release
      executable: RetroDailyTracker
    analyze:
      config: Debug
    archive:
      config: Release
